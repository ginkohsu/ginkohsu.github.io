<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Watchers of the Gate | Ginko Hsu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Scoped to this artwork page. The small wax model keeps its original #watcherIcon styling. */
    .gate-page .gate-content { padding-bottom: 75px; }
    .gate-page .content .gate-hero {
      display: block;
      width: 70%;
      max-width: 700px;
      height: auto;
      padding: 0;
      margin-top: 45px;
      object-fit: contain;
    }
    .gate-caption {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 70%;
      max-width: 700px;
      margin: 13px 0 35px;
      font: 400 11px/1.6 "Syne Mono", monospace;
      color: #817c74;
      text-align: left;
      align-self: center;
    }
    .gate-pair {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      width: 70%;
      max-width: 700px;
      margin: 0 auto 24px;
    }
    .gate-page .content .gate-pair img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      padding: 0;
      object-fit: contain;
    }
    @media (max-width: 768px) {
      .gate-page .content .gate-hero { width: 88%; margin-top: 30px; }
      .gate-caption { width: 88%; margin-bottom: 28px; }
      .gate-pair { width: 88%; gap: 28px; }
    }
  </style>
</head>
<body class="gate-page">
  <div class="container">
    <div id="nav-placeholder"></div>
    <main class="content gate-content" id="main-content">
      <img class="gate-hero" src="resources/Xu_06_01_The Watchers of the Gate.jpg" alt="The Watchers of the Gate, glass sculpture" fetchpriority="high">
      <div class="gate-caption" aria-label="Artwork information">
        <span>The Watchers of the Gate, 2024</span>
        <span>Glass, bioplastic, steel, plaster, epoxy clay, shells, pigment</span>
        <span>68 × 36 × 32 cm</span>
      </div>
      <div class="gate-pair" aria-label="Additional views of The Watchers of the Gate">
        <img src="resources/Xu_06_02_The Watchers of the Gate.jpg" alt="The Watchers of the Gate, additional view" loading="lazy">
        <img src="resources/The_Watchers_Of_The_Gate.jpg" alt="The Watchers of the Gate, additional view" loading="lazy">
      </div>
      <!-- Deliberately retain the original small size and spacing, like a signature. -->
      <img id="watcherIcon" src="resources/watcher_wax.png" alt="Wax model for The Watchers of the Gate" loading="lazy">
    </main>
  </div>
  <script src="site.js" defer></script>
</body>
</html>
