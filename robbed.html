<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The robbed that smiles (2024), an installation by Ginko Hsu at Vapaan Taiteen Tila, Helsinki.">
  <title>The robbed that smiles — Ginko Hsu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="site.js" defer></script>
  <style>
    /* Scoped to this artwork page: the rest of the website stays unchanged. */
    .robbed-page .robbed-content {display:block;min-width:0;padding:0 7% 90px;}
    .robbed-project {width:100%;max-width:1050px;margin:0 auto;}
    .robbed-gallery {width:min(100%,760px);margin:60px auto 0;}
    .robbed-frame {position:relative;aspect-ratio:4 / 5;overflow:hidden;background:#f2f0ed;}
    .robbed-slide {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;opacity:0;visibility:hidden;transition:opacity .25s ease;}
    .robbed-slide:first-child, .robbed-slide.is-active {opacity:1;visibility:visible;z-index:1;}
    .robbed-frame.is-ready .robbed-slide:first-child:not(.is-active) {opacity:0;visibility:hidden;z-index:auto;}
    .robbed-page .content .robbed-slide img {display:block;width:100%;height:100%;max-width:100%;padding:0;object-fit:contain;}
    .robbed-controls {display:flex;align-items:center;justify-content:center;gap:20px;margin:12px 0 0;font:400 11px/1.6 'Syne Mono',monospace;color:#817c74;}
    .robbed-controls button {appearance:none;background:transparent;color:#625d55;border:0;padding:6px 10px;font:inherit;font-size:17px;cursor:pointer;}
    .robbed-controls button:disabled {opacity:.25;cursor:default;}
    .robbed-controls button:focus-visible {outline:1px solid #625d55;outline-offset:3px;}
    .robbed-info {max-width:620px;margin:38px auto 76px;}
    .robbed-caption {display:flex;flex-direction:column;gap:3px;margin:0 0 24px;font:400 11px/1.65 'Syne Mono',monospace;color:#817c74;}
    .robbed-caption span {display:block;}
    .robbed-anchor {width:100%;margin:0;}
    .robbed-page .content .robbed-anchor img {display:block;width:100%;max-width:100%;height:auto;padding:0;object-fit:contain;}
    @media(max-width:768px) {.robbed-page .robbed-content {padding:0 5% 65px;}.robbed-gallery {width:100%;margin-top:35px;}.robbed-info {margin:30px 0 55px;}}
    @media(prefers-reduced-motion:reduce) {.robbed-slide {transition:none;}}
  </style>
</head>
<body class="robbed-page">
  <div class="container">
    <div id="nav-placeholder"></div>
    <main class="content robbed-content" id="main-content">
      <article class="robbed-project">
        <section class="robbed-gallery" aria-label="The robbed that smiles, selected installation photographs">
          <div class="robbed-frame" id="robbed-reader" tabindex="0" aria-label="Photograph viewer; use left and right arrow keys">
            <figure class="robbed-slide is-active" role="group" aria-roledescription="slide" aria-label="1 of 4"><img src="resources/robbed1.png" alt="The robbed that smiles, installation photograph 1 of 4" loading="eager"></figure>
            <figure class="robbed-slide" role="group" aria-roledescription="slide" aria-label="2 of 4" inert><img src="resources/robbed2.png" alt="The robbed that smiles, installation photograph 2 of 4" loading="lazy"></figure>
            <figure class="robbed-slide" role="group" aria-roledescription="slide" aria-label="3 of 4" inert><img src="resources/robbed3.png" alt="The robbed that smiles, installation photograph 3 of 4" loading="lazy"></figure>
            <figure class="robbed-slide" role="group" aria-roledescription="slide" aria-label="4 of 4" inert><img src="resources/robbed4.png" alt="The robbed that smiles, installation photograph 4 of 4" loading="lazy"></figure>
          </div>
          <div class="robbed-controls" aria-label="Photograph navigation">
            <button type="button" data-prev aria-label="Previous photograph" disabled>←</button>
            <span aria-live="polite" aria-atomic="true"><span data-current>1</span> / 4</span>
            <button type="button" data-next aria-label="Next photograph">→</button>
          </div>
        </section>
        <div class="robbed-info">
          <div class="robbed-caption" aria-label="Artwork information">
            <span>The robbed that smiles, 2024</span>
            <span>Glass, ceramics, fabric, bioplastic, organic materials, stone, air-dry clay, shells, pigment · Various dimensions</span>
            <span>Vapaan Taiteen Tila, Helsinki</span>
          </div>
        </div>
        <figure class="robbed-anchor">
          <img src="resources/robbed_l.png" alt="Wide installation view of The robbed that smiles at Vapaan Taiteen Tila, Helsinki" loading="lazy">
        </figure>
      </article>
    </main>
  </div>
  <script>
    (() => {
      const viewport = document.getElementById('robbed-reader');
      if (!viewport) return;
      const slides = [...viewport.querySelectorAll('.robbed-slide')];
      const prev = document.querySelector('[data-prev]');
      const next = document.querySelector('[data-next]');
      const current = document.querySelector('[data-current]');
      let index = 0;
      function show(value) {
        index = Math.max(0, Math.min(slides.length - 1, value));
        slides.forEach((slide, i) => {
          slide.classList.toggle('is-active', i === index);
          slide.toggleAttribute('inert', i !== index);
        });
        current.textContent = String(index + 1);
        prev.disabled = index === 0;
        next.disabled = index === slides.length - 1;
      }
      prev.addEventListener('click', () => show(index - 1));
      next.addEventListener('click', () => show(index + 1));
      viewport.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') { event.preventDefault(); show(index + 1); }
        if (event.key === 'ArrowLeft') { event.preventDefault(); show(index - 1); }
      });
      let startX = null;
      viewport.addEventListener('touchstart', event => { startX = event.changedTouches[0].screenX; }, {passive:true});
      viewport.addEventListener('touchend', event => {
        if (startX === null) return;
        const diff = event.changedTouches[0].screenX - startX;
        if (Math.abs(diff) > 45) show(index + (diff < 0 ? 1 : -1));
        startX = null;
      }, {passive:true});
      show(0);
      viewport.classList.add('is-ready');
    })();
  </script>
</body>
</html>
