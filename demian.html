<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demian | Ginko Hsu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <style>
    /* Demian only; the shared site stylesheet remains unchanged. */
    .demian-page .demian-content { padding-bottom: 85px; }
    .demian-page .content .demian-hero {
      display: block; width: 68%; max-width: 690px; height: auto;
      padding: 0; margin: 48px auto 0; object-fit: contain;
    }
    .demian-caption {
      display: flex; flex-direction: column; gap: 3px;
      width: 68%; max-width: 690px; margin: 14px auto 41px;
      font: 400 11px/1.6 "Syne Mono", monospace;
      color: #817c74; text-align: left;
    }
    .demian-page .content .demian-details {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start; width: 82%; max-width: 820px;
      gap: 14px; margin: 0 auto 43px;
    }
    .demian-page .content .demian-details img {
      display: block; width: 100%; max-width: 100%; height: auto;
      padding: 0; margin: 0; object-fit: contain;
    }
    .demian-page .content #demian2 {
      display: block; width: 58%; max-width: 590px; height: auto;
      padding: 0; margin: 0 auto 44px; object-fit: contain;
    }
    .demian-page .content #demianStudio {
      display: block; width: 44%; max-width: 460px; height: auto;
      padding: 0; margin: 0 auto; object-fit: contain;
    }
    @media (max-width: 768px) {
      .demian-page .content .demian-hero, .demian-caption { width: 88%; }
      .demian-page .content .demian-hero { margin-top: 30px; }
      .demian-page .content .demian-details { width: 100%; gap: 10px; }
      .demian-page .content #demian2 { width: 82%; }
      .demian-page .content #demianStudio { width: 68%; }
    }
    @media (max-width: 480px) {
      .demian-page .content .demian-details { grid-template-columns: 1fr; gap: 18px; }
    }
  </style>
</head>
<body class="demian-page">
  <div class="container">
    <!-- nav will be injected here -->
    <div id="nav-placeholder"></div>

    <!-- Content Section -->
    <main class="content demian-content">
      <img id="demian" class="demian-hero" src="resources/Demian.jpg" alt="Demian, concrete sculpture" fetchpriority="high">
      <div class="demian-caption" aria-label="Artwork information">
        <span>Demian, 2024</span>
        <span>Concrete, tree bark, moss, pigment, bead</span>
        <span>60 × 45 × 35 cm</span>
      </div>

      <div class="part demian-details">
        <img src="resources/demian_part1.jpg" alt="demian_concrete_sculpture_detail">
        <img src="resources/demian_part2.jpg" alt="demian_concrete_sculpture_detail">
      </div>

      <img id="demian2" src="resources/Demian_s.jpg" alt="demian_concrete_sculpture_small">
      <img id="demianStudio" src="resources/demian_studio.jpg" alt="demian_concrete_sculpture_studio">
    </main>
  </div>

  <!-- Load nav.html dynamically -->
  <script src="site.js" defer></script>
</body>
</html>
